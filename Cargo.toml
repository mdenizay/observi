[package]
name = "observi"
version = "0.12.0"
edition = "2024"
description = "Lightweight self-hosted uptime monitor"
license = "MIT"
repository = "https://github.com/mdenizay/observi"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "hostname", "aws-lc-rs", "rustls-native-certs"] }
mime_guess = "2.0.5"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
psl = "2.1.241"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
