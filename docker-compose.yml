# docker compose up -d
# First start: open the web UI and finish the setup wizard. The one-time setup code is
# in the log:  docker compose logs observi | grep 'Setup code'
# (or set OBSERVI_ADMIN_PASSWORD below to skip the wizard)
services:
  observi:
    image: ghcr.io/mdenizay/observi:latest
    container_name: observi
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - observi-data:/data
    environment:
      OBSERVI_LANG: en            # language of notifications: en or tr
      # OBSERVI_ADMIN_USER: admin
      # OBSERVI_ADMIN_PASSWORD: change-me-please
      # OBSERVI_RETENTION: 90     # heartbeat retention in days

volumes:
  observi-data:
